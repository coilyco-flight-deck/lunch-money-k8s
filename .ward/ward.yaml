# Per-repo Ward command allowlist. See AGENTS.md.

commands:
  sync:
    run: uv sync
    description: Install deps via uv.
  smoke:
    run: uv run python scripts/smoke.py
    description: Import the server and list the registered MCP tools.
  verify:
    run: uv run python scripts/verify.py
    description: Live read-only smoke test against the Lunch Money API.
  dump:
    run: uv run python scripts/dump.py
    description: Print uncategorized transactions as TSV (id, date, amount, payee).
  categorize:
    run: uv run python scripts/categorize.py
    description: Seed categories from rules.yaml, then auto-categorize transactions. Rerunnable.
  test:
    run: uv run pytest
    description: Run the pytest suite.
  ruff:
    run: bash scripts/ward-quality.sh check
    description: Lint + format check (no mutations).
  fmt:
    run: bash scripts/ward-quality.sh format
    description: Apply ruff fixes and formatting in place.
  precommit:
    run: uv run pre-commit run --all-files
    description: Run all pre-commit hooks against every file.
  docker:
    run: docker build -t docker.io/coilysiren/lunch-money-k8s:dev .
    description: Build the container image locally.
  check-publish:
    run: bash -n scripts/publish-image.sh
    description: Validate the trusted Forgejo OCI publisher shell contract.
  helm-lint:
    run: bash scripts/ward-helm.sh lint
    description: Lint the Helm chart.
  helm-template:
    run: bash scripts/ward-helm.sh template
    description: Render the Helm chart with default and example values.

catalog:  # cross-repo knowledge-graph metadata; schema coilysiren/agentic-os-kai#420
  kind: Component
  type: service
  system: personal
  owner: kai
  lifecycle: experimental
  description: "MCP server for the Lunch Money API, served over HTTP and packaged with a generic Helm chart. Fleet deployment stays in the deploy repo."
  dependsOn: []
  providesApis:
    - lunch-money-mcp-server
