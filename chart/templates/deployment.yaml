apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunch-money-k8s.fullname" . }}
  labels:
    {{- include "lunch-money-k8s.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lunch-money-k8s.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lunch-money-k8s.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LUNCH_MONEY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunch-money-k8s.secretName" . }}
                  key: token
          {{- if .Values.rules.inline }}
          volumeMounts:
            - name: rules
              mountPath: /app/rules.yaml
              subPath: rules.yaml
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.rules.inline }}
      volumes:
        - name: rules
          configMap:
            name: {{ include "lunch-money-k8s.fullname" . }}-rules
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
