replicaCount: 1

image:
  repository: docker.io/coilysiren/lunch-money-k8s
  tag: ""  # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false  # server never calls the K8s API, so no token

revisionHistoryLimit: 3  # old ReplicaSets the Deployment keeps for rollback

terminationGracePeriodSeconds: 30  # grace period for clean shutdown before SIGKILL

commonLabels: {}  # merged onto every rendered resource

commonAnnotations: {}  # merged onto every rendered resource

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

lunchMoney:  # Lunch Money API token; see docs/chart.md for token vs existingSecret
  token: ""  # set to have the chart create a Secret
  existingSecret: ""  # name of a Secret holding the token under key `token`

rules:  # categorization rules; see docs/chart.md for the inline/ConfigMap flow
  inline: ""  # paste a rules.yaml here to mount it at /app/rules.yaml; empty skips

ingress:
  enabled: false
  className: ""
  host: lunch-money.example.com
  annotations: {}
  tls: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

livenessProbe:  # passed straight to the container; set {} or null to disable, see docs/chart.md
  tcpSocket:
    port: http
  initialDelaySeconds: 10
readinessProbe:  # passed straight to the container; set {} or null to disable
  tcpSocket:
    port: http
  initialDelaySeconds: 5
startupProbe: {}  # off by default; fill a probe block to gate startup before liveness

extraEnv: []  # extra env vars appended to the container
extraEnvFrom: []  # extra envFrom sources for the container

extraVolumes: []  # merged with the rules ConfigMap volume
extraVolumeMounts: []

lifecycleHooks: {}  # rendered as the `lifecycle:` block when set

command: []  # override the container entrypoint; empty uses image defaults
args: []

podDisruptionBudget:  # set minAvailable or maxUnavailable when enabled
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

networkPolicy:  # when on, allows DNS+HTTPS egress and ingress to the http port
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
