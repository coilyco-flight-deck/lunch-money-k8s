replicaCount: 1

image:
  repository: docker.io/coilysiren/lunch-money-k8s
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

revisionHistoryLimit: 3
terminationGracePeriodSeconds: 30

commonLabels: {}
commonAnnotations: {}
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

lunchMoney:
  token: ""
  existingSecret: ""

rules:
  inline: ""

ingress:
  enabled: false
  className: ""
  host: lunch-money.example.com
  annotations: {}
  tls: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5

startupProbe: {}

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
lifecycleHooks: {}
command: []
args: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

networkPolicy:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
