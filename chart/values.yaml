replicaCount: 1

image:
  repository: docker.io/coilysiren/lunch-money-k8s
  tag: ""  # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  # The server never calls the Kubernetes API, so do not mount a token.
  automountServiceAccountToken: false

# Old ReplicaSets the Deployment keeps around for rollback.
revisionHistoryLimit: 3

# Grace period for the pod to shut down cleanly before SIGKILL.
terminationGracePeriodSeconds: 30

# Labels merged onto every rendered resource.
commonLabels: {}

# Annotations merged onto every rendered resource.
commonAnnotations: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

# Lunch Money API token. Either set `token` (the chart creates a Secret),
# or set `existingSecret` to a Secret that holds the token under key `token`.
lunchMoney:
  token: ""
  existingSecret: ""

# Categorization rules. Paste the contents of a rules.yaml into `inline`
# to mount it as a ConfigMap at /app/rules.yaml. Leave empty to skip.
rules:
  inline: ""

ingress:
  enabled: false
  className: ""
  host: lunch-money.example.com
  annotations: {}
  tls: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

# Health probes. Each block is passed straight through to the container.
# Override the whole block to change probe style, or set it to {} (or null)
# to disable that probe. Defaults match the original tcpSocket-on-http checks.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
# Off by default. Fill in a probe block to gate startup before liveness runs.
startupProbe: {}

# Extra env vars appended to the container. List of standard env entries.
extraEnv: []
# Extra envFrom sources for the container. List of standard envFrom entries.
extraEnvFrom: []

# Extra volumes and mounts, merged with the rules ConfigMap volume.
extraVolumes: []
extraVolumeMounts: []

# Container lifecycle hooks, rendered as the `lifecycle:` block when set.
lifecycleHooks: {}

# Override the container entrypoint and arguments. Empty means use the image defaults.
command: []
args: []

# PodDisruptionBudget. Set one of minAvailable / maxUnavailable when enabled.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# NetworkPolicy. When on, allows DNS and HTTPS egress plus ingress to the http port.
networkPolicy:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
