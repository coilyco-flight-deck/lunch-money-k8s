# Categorization rules. Copy to rules.yaml (gitignored) and edit for your own spending.

categories:
  - name: Groceries
  - name: Restaurants
  - name: Transportation
  - name: Subscriptions
  - name: Shopping
  - name: Utilities
  - name: Rent
  - name: Income
    is_income: true
  - name: Credit Card Payments
    exclude_from_totals: true

rules:  # payee prefix -> category; case-insensitive, first match wins, specific first
  - ["Whole Foods", "Groceries"]
  - ["Trader Joe", "Groceries"]
  - ["Starbucks", "Restaurants"]
  - ["Uber", "Transportation"]
  - ["Lyft", "Transportation"]
  - ["Netflix", "Subscriptions"]
  - ["Spotify", "Subscriptions"]
  - ["Amazon", "Shopping"]
  - ["Comcast", "Utilities"]
  - ["Payroll", "Income"]
  - ["Credit Card Payment", "Credit Card Payments"]
