[project]
name = "lunch-money-k8s"
version = "0.1.0"
description = "MCP server for the Lunch Money API, containerized and Helm-deployable to Kubernetes."
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "boto3>=1.34",
    "pyyaml>=6.0",
]

[project.scripts]
lunch-money-mcp = "lunch_money_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lunch_money_mcp"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
