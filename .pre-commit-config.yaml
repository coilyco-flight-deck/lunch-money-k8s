repos:
  - repo: local
    hooks:
      - id: trufflehog
        name: trufflehog (secret scan, offline)
        description: Detect secrets in staged changes via local trufflehog binary.
        entry: trufflehog git file://. --since-commit HEAD --no-verification --no-update --fail
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: ruff
        name: ruff (lint, matches CI)
        description: Lint every tracked Python file, identical to the CI lint job.
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

  - repo: local
    hooks:
      - id: coily-trailer
        name: coily audit-log trailer
        description: Append Audit-log trailers based on coily's audit log for this repo.
        entry: coily git trailer-hook
        language: system
        stages: [prepare-commit-msg]
        always_run: true
        require_serial: true

  # BEGIN managed by agentic-os/scripts/apply-agentic-os-hooks.py
  - repo: https://github.com/coilyco-flight-deck/agentic-os
    rev: v0.11.1
    hooks:
      - id: catalog-doc-size
      - id: catalog-trifecta
      - id: documentation-layout
      - id: context-load-points
      - id: code-comments
      - id: catalog-block-present
      - id: validate-skills
      - id: dead-cross-links
      - id: repo-pointer-skills
      - id: closes-issue
      - id: conventional-commit
      - id: trufflehog
      - id: coily-trailer
  # END managed by agentic-os/scripts/apply-agentic-os-hooks.py
