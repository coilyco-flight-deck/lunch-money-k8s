# Example homelab values; install steps and token options live in docs/deploy.md.

image:
  repository: docker.io/coilysiren/lunch-money-k8s
  tag: latest

lunchMoney:
  existingSecret: lunch-money-token

nodeSelector:  # pin to a single node if the cluster is mixed-architecture
  kubernetes.io/hostname: kai-server

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

rules:  # auto-categorization rules mounted at /app/rules.yaml; replace with your own
  inline: |
    categories:
      - name: Groceries
      - name: Restaurants
    rules:
      - ["Whole Foods", "Groceries"]
      - ["Starbucks", "Restaurants"]
