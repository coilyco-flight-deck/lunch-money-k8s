# Example values for a homelab install of lunch-money-k8s.
# Install:  helm install lunch-money ./chart -f examples/values-homelab.yaml
#
# This example uses an existing Secret for the token (created out of band,
# e.g. by an ExternalSecret pulling from a parameter store). For a quick
# start instead, drop `existingSecret` and pass --set lunchMoney.token=...

image:
  repository: docker.io/coilysiren/lunch-money-k8s
  tag: latest

lunchMoney:
  existingSecret: lunch-money-token

# Pin to a single node if the cluster is mixed-architecture.
nodeSelector:
  kubernetes.io/hostname: kai-server

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# Auto-categorization rules mounted at /app/rules.yaml. Replace with your own.
rules:
  inline: |
    categories:
      - name: Groceries
      - name: Restaurants
    rules:
      - ["Whole Foods", "Groceries"]
      - ["Starbucks", "Restaurants"]
