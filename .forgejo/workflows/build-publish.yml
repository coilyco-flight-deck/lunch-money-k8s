# Tests and Helm validation, then builds and publishes the lunch-money-mcp image
# to the in-cluster registry on every push to main. No deploy stage here:
# rollout is
# driven from coilyco-bridge/deploy/services/lunch-money-mcp per the layer
# invariant (source -> deploy). Mirrors coilyco-flight-deck/node-stats-mcp and
# coilyco-flight-deck/reddit-mcp's build-publish, with an additional chart lane.
#
# Replaces the retired GitHub Actions path (.github/workflows/docker.yml ->
# Docker Hub, .github/workflows/ci.yml -> tests): canonical CI is Forgejo, and
# GitHub is the PR mirror only. See coilyco-flight-deck/lunch-money-k8s#23 and
# docs/deploy.md for the publish-step details (docker CLI + DinD host probe, and
# the sha-<short> + latest tag scheme the deploy bundle pins).
name: build-publish

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
          except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
  helm:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: bash scripts/ward-helm.sh lint
      - run: bash scripts/ward-helm.sh template

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
  publish:
    runs-on: docker
    needs: [test, helm]
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - name: Resolve docker host
        run: |
          set -euo pipefail
          gw=$(node -e "const fs=require('fs');const l=(fs.readFileSync('/proc/net/route','utf8').split('\n').find(x=>x.split('\t')[1]==='00000000'))||'';const h=l.split(/\s+/)[2]||'';if(h){console.log(h.match(/../g).reverse().map(x=>parseInt(x,16)).join('.'))}" || true)
          for h in "tcp://${gw}:2375" "${DOCKER_HOST:-}" tcp://localhost:2375 unix:///var/run/docker.sock; do
            [ -z "$h" ] && continue
            [ "$h" = "tcp://:2375" ] && continue
            if docker -H "$h" info >/dev/null 2>&1; then
              echo "docker daemon reachable at $h"
              echo "DOCKER_HOST=$h" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "no docker daemon at $h"
          done
          echo "no reachable docker daemon" >&2
          exit 1
      - name: Build and push
        run: |
          set -euo pipefail
          registry=192.168.0.194:30500
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build \
            -t "${registry}/lunch-money-mcp:sha-${short}" \
            -t "${registry}/lunch-money-mcp:latest" .
          docker push "${registry}/lunch-money-mcp:sha-${short}"
          docker push "${registry}/lunch-money-mcp:latest"
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on main",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
