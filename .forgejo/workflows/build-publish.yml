# Tests and Helm validation, then publishes the lunch-money-mcp image to
# Forgejo OCI on every push to main. No deploy stage here: rollout is driven
# from coilyco-bridge/deploy/services/lunch-money-mcp per the layer invariant
# (source -> deploy).
#
# Replaces the retired GitHub Actions path (.github/workflows/docker.yml ->
# Docker Hub, .github/workflows/ci.yml -> tests): canonical CI is Forgejo, and
# GitHub is the PR mirror only. See coilyco-flight-deck/lunch-money-k8s#23 and
# docs/deploy.md for the immutable publication contract.
#
# Every job on the `docker` label pins the agentic-os:release container. That
# image already carries uv and helm, so no job downloads a toolchain at run
# time. The `docker` runner allows 30m per job total, and a job that stalls on
# a network fetch burns the whole budget and reports `cancelled`. See #38.
#
# The quality step shells out to scripts/ward-quality.sh, the same entry the
# local pre-commit hook runs, so lint and format cannot drift apart and let a
# commit pass locally then fail here.
#
# workflow_dispatch is the retry path. The publish job builds against external
# registries, so a network flake fails a run whose commit is fine. This instance
# serves neither actions/runs/{id}/rerun nor rerun-failed-jobs, so without a
# dispatch trigger the only retry was another commit. See #46.
name: build-publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --group dev
      - run: uv run pytest
      - run: bash scripts/ward-quality.sh check

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: python3 scripts/ci/telegram-alert.py
  helm:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ward-helm.sh lint
      - run: bash scripts/ward-helm.sh template

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: python3 scripts/ci/telegram-alert.py
  publish:
    runs-on: deploy
    needs: [test, helm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable image
        run: bash scripts/publish-image.sh
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: python3 scripts/ci/telegram-alert.py
